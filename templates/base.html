<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}MetNum{% endblock %} | Métodos Numéricos</title>
    <meta name="description" content="Calculadora interactiva de métodos numéricos desarrollada con Flask.">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body>
    <header class="site-header">
        <nav class="nav container" aria-label="Principal">
            <a href="{{ url_for('home') }}" class="brand">
                <span class="brand-mark">Σ</span>
                <span class="brand-copy">Numerika <small>Métodos</small></span>
            </a>
            <div class="nav-links">
                <a class="{{ 'active' if request.endpoint == 'home' else '' }}" href="{{ url_for('home') }}">Inicio</a>
                <a class="{{ 'active' if request.endpoint == 'calculator' else '' }}" href="{{ url_for('calculator') }}">Resolver</a>
            </div>
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    {% block scripts %}{% endblock %}
</body>
</html>
